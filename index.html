<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ensaladera</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; background: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .screen { display: none; max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .active { display: block; }
        h1 { font-size: 2em; margin-bottom: 20px; }
        h3 { color: #555; margin-bottom: 10px; }
        input[type="text"], input[type="number"] { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        
        button { background: #007bff; color: white; border: none; padding: 15px 20px; width: 100%; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button:hover { background: #0056b3; }
        button.secondary { background: #6c757d; }
        button.success { background: #28a745; }
        button.danger { background: #dc3545; }
        button.warning { background: #ffc107; color: #333; }
        button:disabled { background: #ccc; cursor: not-allowed; color: #666; }
        
        /* Botón de juego unificado gigante */
        #btn-main { height: 100px; font-size: 1.5em; margin-top: 20px; text-transform: uppercase; box-shadow: 0 6px 0 rgba(0,0,0,0.2); transition: all 0.1s; }
        #btn-main:active { transform: translateY(6px); box-shadow: none; }

        /* Botones extra de acciones (Saltar / Error) */
        .action-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        #btn-skip { display: none; flex: 1; }
        #btn-wrong { display: none; flex: 1; font-size: 14px; padding: 10px; background: #c82333; color: white; border: 2px solid #a71d2a; }

        .word-display { font-size: 3.5em; font-weight: bold; margin: 30px 0; text-transform: uppercase; color: #007bff; min-height: 100px; display: flex; align-items: center; justify-content: center;}
        .timer { font-size: 3.5em; font-weight: bold; color: #dc3545; margin: 10px 0; }
        .stats { display: flex; justify-content: space-between; font-size: 1.2em; font-weight: bold; margin-bottom: 10px; color: #555; background: #e9ecef; padding: 10px; border-radius: 8px;}
        hr { margin: 30px 0; border: 0; border-top: 1px solid #eee; }
        
        .config-row { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; font-weight: bold; font-size: 1.1em; text-align: left; padding: 0 10px; }
        .config-row input[type="number"] { width: 70px; margin: 0; text-align: center; }
        .config-row input[type="checkbox"] { transform: scale(1.5); margin-left: 10px; }
    </style>
</head>
<body>

    <!-- PANTALLA DE INICIO -->
    <div id="home-screen" class="screen active">
        <h1>🥗 Ensaladera</h1>
        <button onclick="createRoom()">Crear Partida (Anfitrión)</button>
        <button class="secondary" onclick="showScreen('join-screen')">Unirse (Jugador)</button>
    </div>

    <!-- PANTALLA DE JUGADOR (UNIRSE) -->
    <div id="join-screen" class="screen">
        <h1>Unirse a la Partida</h1>
        <input type="text" id="join-code" placeholder="Código de 4 Letras" maxlength="4" style="text-transform:uppercase">
        <div id="word-inputs">
            <input type="text" class="player-word" placeholder="Palabra 1">
            <input type="text" class="player-word" placeholder="Palabra 2">
            <input type="text" class="player-word" placeholder="Palabra 3">
        </div>
        <button onclick="addWordInput()">+ Agregar Otra Palabra</button>
        <button class="success" onclick="submitWords()">Enviar Palabras</button>
        <button class="secondary" onclick="showScreen('home-screen')">Volver</button>
    </div>

    <!-- PANTALLA DEL ANFITRIÓN (LOBBY) -->
    <div id="lobby-screen" class="screen">
        <h2>Código de Sala:</h2>
        <h1 id="display-room-code" style="font-size: 4em; color: #007bff; letter-spacing: 5px;">ABCD</h1>
        <h2 id="word-count" style="color: #28a745;">Palabras en la Olla: 0</h2>
        
        <hr>
        <h3>Tus Palabras (Anfitrión):</h3>
        <div id="host-word-inputs">
            <input type="text" class="host-word" placeholder="Palabra 1">
            <input type="text" class="host-word" placeholder="Palabra 2">
            <input type="text" class="host-word" placeholder="Palabra 3">
        </div>
        <button class="secondary" onclick="addHostWordInput()">+ Agregar Otra Palabra</button>
        <button id="btn-host-submit" onclick="submitHostWords()">Enviar Mis Palabras</button>

        <hr>
        <h3>Configuración de Partida:</h3>
        
        <div class="config-row">
            <label for="time-limit-input">Tiempo por turno (seg):</label>
            <input type="number" id="time-limit-input" value="60" min="10" max="120">
        </div>
        
        <div class="config-row">
            <label for="allow-skip-input">Permitir saltar palabras:</label>
            <input type="checkbox" id="allow-skip-input">
        </div>

        <button class="danger" style="padding: 20px; font-size: 1.2em; margin-top: 20px;" onclick="startGame()">¡Comenzar Juego!</button>
    </div>

    <!-- PANTALLA DE ESPERA (JUGADORES) -->
    <div id="waiting-screen" class="screen">
        <h1>¡Palabras Enviadas!</h1>
        <p>Mira la pantalla del Anfitrión. El juego comenzará pronto.</p>
    </div>

    <!-- PANTALLA DE JUEGO (ANFITRIÓN) -->
    <div id="game-screen" class="screen">
        <div class="stats">
            <span id="round-display">1. Definición</span>
            <span id="words-left-display">Restantes: 0</span>
        </div>
        
        <div class="timer" id="timer-display">60</div>
        <div class="word-display" id="current-word">???</div>
        
        <button id="btn-main" onclick="handleMainAction()">Iniciar Turno</button>

        <div class="action-buttons">
            <button id="btn-skip" class="warning" onclick="handleSkip()">Saltar</button>
            <button id="btn-wrong" onclick="handleWrongGuess()">Adivinaron Mal</button>
        </div>
    </div>

<script>
    // --- 1. VARIABLES DEL JUEGO ---
    let roomCode = "";
    let wordPool = [];
    
    // Variables de configuración y máquina de estados
    let turnTimeLimit = 60;
    let allowSkip = true;
    let timeLeft = 60;
    let timerInterval;
    let currentWordIndex = 0;
    let currentRoundIndex = 0;
    const roundNames = ["1. Definición", "2. Mímica", "3. Una Palabra"];
    let gameState = "WAITING"; // WAITING, PLAYING, TIME_UP, WRONG_GUESS, ROUND_END, GAME_OVER

    // --- 2. NAVEGACIÓN ---
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // --- 3. LÓGICA DEL LOBBY ---
    function createRoom() {
        if (!window.database) return alert("¡Base de datos no conectada!");
        
        roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById('display-room-code').innerText = roomCode;
        
        window.database.ref('rooms/' + roomCode + '/words').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                wordPool = Object.values(data);
                document.getElementById('word-count').innerText = "Palabras en la Olla: " + wordPool.length;
            }
        });
        showScreen('lobby-screen');
    }

    function addHostWordInput() {
        const inputs = document.getElementById('host-word-inputs');
        const inputCount = inputs.children.length + 1;
        const newInput = document.createElement('input');
        newInput.type = "text";
        newInput.className = "host-word";
        newInput.placeholder = "Palabra " + inputCount;
        inputs.appendChild(newInput);
    }

    function submitHostWords() {
        if (!window.database) return alert("¡Base de datos no conectada!");
        const inputs = document.querySelectorAll('.host-word');
        const words = Array.from(inputs).map(input => input.value.trim()).filter(val => val !== "");
        if (words.length === 0) return alert("Ingresa al menos una palabra.");

        words.forEach(word => window.database.ref('rooms/' + roomCode + '/words').push(word));

        inputs.forEach(input => input.value = "");
        const btn = document.getElementById('btn-host-submit');
        btn.innerText = "¡Enviadas!";
        btn.disabled = true;
        btn.className = "success";
    }

    function addWordInput() {
        const inputs = document.getElementById('word-inputs');
        const inputCount = inputs.children.length + 1;
        const newInput = document.createElement('input');
        newInput.type = "text";
        newInput.className = "player-word";
        newInput.placeholder = "Palabra " + inputCount;
        inputs.appendChild(newInput);
    }

    function submitWords() {
        if (!window.database) return alert("¡Base de datos no conectada!");
        const code = document.getElementById('join-code').value.toUpperCase();
        if (!code) return alert("Ingresa el código.");

        const inputs = document.querySelectorAll('.player-word');
        const words = Array.from(inputs).map(input => input.value.trim()).filter(val => val !== "");
        if (words.length === 0) return alert("Ingresa al menos una palabra.");

        words.forEach(word => window.database.ref('rooms/' + code + '/words').push(word));
        showScreen('waiting-screen');
    }

    // --- 4. LÓGICA DEL JUEGO (MÁQUINA DE ESTADOS) ---
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function startGame() {
        if (wordPool.length === 0) return alert("¡La olla está vacía!");
        window.database.ref('rooms/' + roomCode + '/words').off(); // Desconectar base de datos

        // Leer configuraciones
        turnTimeLimit = parseInt(document.getElementById('time-limit-input').value) || 60;
        allowSkip = document.getElementById('allow-skip-input').checked;
        
        timeLeft = turnTimeLimit;
        currentRoundIndex = 0;
        currentWordIndex = 0;
        shuffle(wordPool);

        showScreen('game-screen');
        setGameState('WAITING');
    }

    function updateGameUI() {
        document.getElementById('round-display').innerText = roundNames[currentRoundIndex] || "";
        document.getElementById('words-left-display').innerText = "Restantes: " + (wordPool.length - currentWordIndex);
        document.getElementById('timer-display').innerText = timeLeft;
    }

    function setGameState(newState) {
        gameState = newState;
        const btnMain = document.getElementById('btn-main');
        const btnSkip = document.getElementById('btn-skip');
        const btnWrong = document.getElementById('btn-wrong');
        const wordDisplay = document.getElementById('current-word');

        updateGameUI();

        // Controlar visibilidad de botones extra solo si estamos jugando
        if (newState === 'PLAYING') {
            btnSkip.style.display = allowSkip ? 'inline-block' : 'none';
            // Ronda 3 = índice 2
            btnWrong.style.display = (currentRoundIndex === 2) ? 'inline-block' : 'none';
        } else {
            btnSkip.style.display = 'none';
            btnWrong.style.display = 'none';
        }

        if (newState === 'WAITING') {
            clearInterval(timerInterval);
            wordDisplay.innerText = "¿Listos?";
            btnMain.innerText = "▶️ Iniciar Turno";
            btnMain.className = "success";
        }
        else if (newState === 'PLAYING') {
            wordDisplay.innerText = wordPool[currentWordIndex];
            btnMain.innerText = "Siguiente Palabra ⏭️";
            btnMain.className = "secondary";
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = timeLeft;
                if (timeLeft <= 0) {
                    setGameState('TIME_UP');
                }
            }, 1000);
        }
        else if (newState === 'TIME_UP') {
            clearInterval(timerInterval);
            wordDisplay.innerText = "¡TIEMPO!";
            btnMain.innerText = "Pasar Teléfono";
            btnMain.className = "danger";
        }
        else if (newState === 'WRONG_GUESS') {
            clearInterval(timerInterval);
            wordDisplay.innerText = "¡INCORRECTO!";
            btnMain.innerText = "Pasar Teléfono";
            btnMain.className = "danger";
        }
        else if (newState === 'ROUND_END') {
            clearInterval(timerInterval);
            wordDisplay.innerText = "¡FIN DE RONDA!";
            
            currentRoundIndex++;
            if (currentRoundIndex >= 3) {
                setGameState('GAME_OVER');
            } else {
                btnMain.innerText = "Empezar: " + roundNames[currentRoundIndex];
                btnMain.className = "warning";
            }
        }
        else if (newState === 'GAME_OVER') {
            clearInterval(timerInterval);
            wordDisplay.innerText = "¡JUEGO TERMINADO!";
            btnMain.innerText = "Volver al Menú Principal";
            btnMain.className = "primary";
        }
    }

    // --- 5. ACCIONES DE BOTONES DE JUEGO ---
    function handleMainAction() {
        if (gameState === 'WAITING') {
            setGameState('PLAYING');
        }
        else if (gameState === 'PLAYING') {
            currentWordIndex++;
            if (currentWordIndex >= wordPool.length) {
                setGameState('ROUND_END');
            } else {
                document.getElementById('current-word').innerText = wordPool[currentWordIndex];
                updateGameUI();
            }
        }
        else if (gameState === 'TIME_UP' || gameState === 'WRONG_GUESS') {
            timeLeft = turnTimeLimit; 
            setGameState('WAITING');
        }
        else if (gameState === 'ROUND_END') {
            shuffle(wordPool);
            currentWordIndex = 0;
            if (timeLeft > 0) {
                setGameState('PLAYING');
            } else {
                timeLeft = turnTimeLimit;
                setGameState('WAITING');
            }
        }
        else if (gameState === 'GAME_OVER') {
            location.reload();
        }
    }

    function handleSkip() {
        if (gameState !== 'PLAYING') return;
        const wordsLeft = wordPool.length - currentWordIndex;
        
        // Solo podemos saltar si hay más de una palabra en la olla para cambiar
        if (wordsLeft > 1) {
            // Sacar la palabra actual de su lugar y mandarla al final de la olla
            const skippedWord = wordPool.splice(currentWordIndex, 1)[0];
            wordPool.push(skippedWord);
            
            // Actualizar la pantalla
            document.getElementById('current-word').innerText = wordPool[currentWordIndex];
            updateGameUI();
        }
    }

    function handleWrongGuess() {
        if (gameState !== 'PLAYING') return;
        setGameState('WRONG_GUESS');
    }

    // --- 6. CONFIGURACIÓN DE FIREBASE ---
    try {
        const firebaseConfig = {
            apiKey: "AIzaSyCEwxWMvydTVsZnMH-GfEpCNa5wJDV9H4c",
            authDomain: "ensaladera-navegantes-be482.firebaseapp.com",
            databaseURL: "https://ensaladera-navegantes-be482-default-rtdb.firebaseio.com",
            projectId: "ensaladera-navegantes-be482",
            storageBucket: "ensaladera-navegantes-be482.firebasestorage.app",
            messagingSenderId: "490057604724",
            appId: "1:490057604724:web:4904658157c1fefa58bb21"
        };

        firebase.initializeApp(firebaseConfig);
        window.database = firebase.database();
    } catch (error) {
        console.error("ERROR DE FIREBASE:", error);
        alert("No se pudo conectar a Firebase. Revisa los bloqueadores de anuncios.");
    }
</script>
</body>
</html>
